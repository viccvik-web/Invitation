<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Photo Carousel</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Confetti Celebration for Final Slide -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg-cream: #F9F6F0;
      --accent-burgundy: #852638;
      --accent-rose: #E26D82;
    }

    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-cream);
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
      touch-action: pan-y;
    }

    /* Ambient paper backdrop */
    .ambient-bg {
      background-color: #FAF6EE;
      background-image: 
        radial-gradient(at 0% 0%, rgba(226, 109, 130, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(156, 183, 212, 0.12) 0px, transparent 50%),
        radial-gradient(rgba(133, 38, 56, 0.025) 1px, transparent 0);
      background-size: 100% 100%, 100% 100%, 22px 22px;
    }

    /* 3D perspective stage for cards */
    .carousel-stage {
      perspective: 1200px;
    }

    .slide-card {
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1),
                  opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1),
                  filter 0.5s ease;
      will-change: transform, opacity;
      transform-style: preserve-3d;
    }

    /* Floating Heart Pop Animation */
    @keyframes popHeart {
      0% {
        transform: translate(-50%, -50%) scale(0) rotate(-12deg);
        opacity: 0;
      }
      35% {
        transform: translate(-50%, -50%) scale(1.4) rotate(8deg);
        opacity: 1;
      }
      60% {
        transform: translate(-50%, -50%) scale(1.1) rotate(-4deg);
        opacity: 0.95;
      }
      100% {
        transform: translate(-50%, -85%) scale(1.7) rotate(0deg);
        opacity: 0;
      }
    }

    .heart-burst {
      position: absolute;
      pointer-events: none;
      animation: popHeart 0.9s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      z-index: 60;
      filter: drop-shadow(0 10px 20px rgba(226, 109, 130, 0.55));
    }

    @keyframes particleDrift {
      0% {
        transform: translate(0, 0) scale(0.8);
        opacity: 1;
      }
      100% {
        transform: translate(var(--tx), var(--ty)) scale(0);
        opacity: 0;
      }
    }

    .mini-heart {
      position: absolute;
      pointer-events: none;
      animation: particleDrift 0.75s ease-out forwards;
      z-index: 59;
    }

    /* Minimalist Glass Mute Button */
    .glass-mute-btn {
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 4px 20px -2px rgba(100, 116, 139, 0.16);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .glass-mute-btn:hover {
      background: rgba(255, 255, 255, 0.98);
      transform: scale(1.05);
      box-shadow: 0 6px 24px -2px rgba(133, 38, 56, 0.2);
    }
    .glass-mute-btn:active {
      transform: scale(0.94);
    }

    /* Soundwave animation inside mute button */
    @keyframes wavePulse {
      0%, 100% { height: 4px; }
      50% { height: 16px; }
    }
    .wave-bar {
      width: 2.5px;
      background-color: var(--accent-burgundy);
      border-radius: 9999px;
      animation: wavePulse 1s ease-in-out infinite;
    }
    .wave-bar:nth-child(2) { animation-delay: 0.18s; }
    .wave-bar:nth-child(3) { animation-delay: 0.36s; }
    .wave-bar:nth-child(4) { animation-delay: 0.12s; }
    .is-muted .wave-bar {
      animation: none !important;
      height: 3px !important;
      opacity: 0.4;
    }

    /* Side navigation arrow overlays */
    .nav-arrow {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 6px 24px -4px rgba(0, 0, 0, 0.08);
      transition: all 0.25s ease;
      opacity: 0.45;
    }
    .nav-arrow:hover {
      opacity: 1;
      transform: translateY(-50%) scale(1.08);
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 8px 30px -4px rgba(133, 38, 56, 0.22);
    }
    .nav-arrow:active {
      transform: translateY(-50%) scale(0.95);
    }

    /* Story bar progress fill transition */
    .story-bar-fill {
      transition: width 0.35s ease-out;
    }
  </style>
</head>

<body class="ambient-bg h-screen w-screen flex flex-col justify-between items-center relative p-3 sm:p-6 selection:bg-rose-100">

  <!-- Top Minimalist Progress Bar (12 Segments) -->
  <nav class="w-full max-w-4xl pt-1 sm:pt-2 px-2 z-40 flex items-center justify-between gap-4">
    <div id="storyBars" class="flex-1 flex items-center space-x-1 sm:space-x-1.5 h-1">
      <!-- 12 progress bar segments generated via JS -->
    </div>
  </nav>

  <!-- Floating Audio Mute / Unmute Button -->
  <div class="fixed top-4 right-4 sm:top-6 sm:right-6 z-50">
    <button id="muteToggleBtn" aria-label="Toggle Sound" class="glass-mute-btn px-3.5 py-2.5 rounded-full flex items-center space-x-2 text-xs font-semibold text-gray-800 cursor-pointer">
      <div id="waveContainer" class="flex items-end space-x-0.5 h-4 w-4 justify-center">
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
      </div>
      <svg id="muteCrossIcon" class="w-4 h-4 text-gray-500 hidden" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />
      </svg>
      <span id="muteLabelText" class="tracking-wide">Mute</span>
    </button>
  </div>

  <main class="flex-1 w-full max-w-5xl flex items-center justify-center relative my-auto">
    
    <div class="carousel-stage relative w-full h-[76vh] max-h-[820px] flex items-center justify-center">
      
      <!-- Slide Track Holding All 12 Pictures strictly ordered -->
      <div id="cardDeck" class="relative w-full h-full max-w-4xl flex items-center justify-center">
        <!-- 12 Slides injected dynamically -->
      </div>

      <!-- Minimal Left Arrow -->
      <button id="prevArrow" aria-label="Previous image" class="nav-arrow absolute left-2 sm:left-4 top-1/2 -translate-y-1/2 w-11 h-11 sm:w-13 sm:h-13 rounded-full flex items-center justify-center text-gray-800 z-40 cursor-pointer">
        <svg class="w-5 h-5 sm:w-6 sm:h-6 -translate-x-0.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
        </svg>
      </button>

      <!-- Minimal Right Arrow -->
      <button id="nextArrow" aria-label="Next image" class="nav-arrow absolute right-2 sm:right-4 top-1/2 -translate-y-1/2 w-11 h-11 sm:w-13 sm:h-13 rounded-full flex items-center justify-center text-gray-800 z-40 cursor-pointer">
        <svg class="w-5 h-5 sm:w-6 sm:h-6 translate-x-0.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
        </svg>
      </button>

    </div>

  </main>

  <!-- Audio element referencing the user's attached song file -->
  <audio id="backgroundAudio" loop preload="auto">
    <!-- Primary attached audio title -->
    <source src="song.mp3" type="audio/mpeg">
    <!-- Standard portable fallbacks -->
    <source src="song.mp3" type="audio/mpeg">
    <source src="audio.mp3" type="audio/mpeg">
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <script>
    /*
     * The 13 pictures strictly ordered by file name (0.jpg through 12.jpg).
     * Total picture count updated to 13.
     */
    const totalPictures = 13;
    const pictureFiles = Array.from({ length: totalPictures }, (_, i) => `${i}.jpg`);

    let activeIndex = 0;
    let audioInitiated = false;
    let isSoundMuted = false;
    let romanticPianoSynth = null;

    // DOM references
    const cardDeck = document.getElementById('cardDeck');
    const storyBarsContainer = document.getElementById('storyBars');
    const prevArrow = document.getElementById('prevArrow');
    const nextArrow = document.getElementById('nextArrow');
    const muteToggleBtn = document.getElementById('muteToggleBtn');
    const muteLabelText = document.getElementById('muteLabelText');
    const waveContainer = document.getElementById('waveContainer');
    const muteCrossIcon = document.getElementById('muteCrossIcon');
    const backgroundAudio = document.getElementById('backgroundAudio');

    /*
     * Generates a warm piano accompaniment of "Anata no Soba ni"
     * so enchanting music plays even if local MP3 is blocked in browser iframe
     */
    class AmbientPianoSynthesizer {
      constructor() {
        this.ctx = null;
        this.active = false;
        this.timer = null;
        // Pentatonic, heart-warming melodic chords inspired by the theme
        this.progression = [
          [261.63, 329.63, 392.00, 523.25], // C Major
          [220.00, 261.63, 329.63, 440.00], // A minor
          [174.61, 220.00, 261.63, 349.23], // F Major
          [196.00, 246.94, 293.66, 392.00], // G Major
          [220.00, 261.63, 349.23, 440.00], // Dm7
          [164.81, 196.00, 246.94, 329.63]  // Em7
        ];
        this.step = 0;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playNote(frequency, time, duration = 3.6, gainLevel = 0.045) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        const lowpass = this.ctx.createBiquadFilter();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(frequency, time);

        lowpass.type = 'lowpass';
        lowpass.frequency.setValueAtTime(750, time);
        lowpass.frequency.exponentialRampToValueAtTime(300, time + duration);

        gain.gain.setValueAtTime(0.0001, time);
        gain.gain.linearRampToValueAtTime(gainLevel, time + 0.08);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + duration);

        osc.connect(lowpass);
        lowpass.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(time);
        osc.stop(time + duration);
      }

      playSequence() {
        if (!this.active || !this.ctx) return;
        const now = this.ctx.currentTime;
        const chord = this.progression[this.step % this.progression.length];
        this.step++;

        chord.forEach((note, index) => {
          this.playNote(note, now + index * 0.32, 3.8, 0.038);
        });

        // Delicate top-register melody chime
        const chime = chord[chord.length - 1] * 1.5;
        this.playNote(chime, now + 1.4, 2.8, 0.022);

        this.timer = setTimeout(() => this.playSequence(), 3500);
      }

      start() {
        this.init();
        this.active = true;
        this.playSequence();
      }

      stop() {
        this.active = false;
        if (this.timer) clearTimeout(this.timer);
      }

      setMute(muted) {
        if (!this.ctx) return;
        if (muted) {
          this.stop();
        } else {
          this.start();
        }
      }
    }

    // Gentle pop sound for the double tap heart
    function playHeartChime() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
        osc.frequency.exponentialRampToValueAtTime(880.00, ctx.currentTime + 0.1); // A5

        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.16);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        osc.stop(ctx.currentTime + 0.17);
      } catch (err) {
        // Safe silence if audio context is blocked
      }
    }

    function initCarousel() {
      cardDeck.innerHTML = '';
      storyBarsContainer.innerHTML = '';

      pictureFiles.forEach((fileName, index) => {
        // 1. Progress Bar Segment
        const segment = document.createElement('div');
        segment.className = 'h-full flex-1 bg-black/10 rounded-full overflow-hidden cursor-pointer';
        segment.innerHTML = `<div id="fill-${index}" class="story-bar-fill h-full bg-[#852638] w-0 rounded-full"></div>`;
        segment.addEventListener('click', () => jumpToSlide(index));
        storyBarsContainer.appendChild(segment);

        // 2. Slide Card
        const card = document.createElement('div');
        card.id = `slide-${index}`;
        card.className = 'slide-card absolute inset-0 w-full h-full rounded-2xl sm:rounded-3xl overflow-hidden cursor-pointer select-none bg-white shadow-2xl border border-[#9CB7D4]/35 flex items-center justify-center p-1 sm:p-2';

        const img = document.createElement('img');
        img.src = fileName;
        img.alt = `Slide ${index + 1}`;
        img.className = 'w-full h-full object-contain pointer-events-none rounded-xl sm:rounded-2xl transition-transform duration-500';
        img.loading = index < 3 ? 'eager' : 'lazy';

        // Add soft fallback if an image isn't yet present
        img.onerror = () => {
          img.src = `https://placehold.co/1200x800/F8F5EE/852638?text=${encodeURIComponent(fileName)}`;
        };

        card.appendChild(img);
        cardDeck.appendChild(card);

        // Double-Tap and Double-Click Heart Pop Listener
        bindDoubleTap(card);
      });

      renderSlidePositions();
    }

    function bindDoubleTap(element) {
      let lastTap = 0;
      let singleTapTimer = null;

      element.addEventListener('pointerup', (e) => {
        const currentTime = new Date().getTime();
        const tapDifference = currentTime - lastTap;

        if (tapDifference < 320 && tapDifference > 0) {
          clearTimeout(singleTapTimer);
          createHeartBurst(e, element);
          lastTap = 0;
        } else {
          lastTap = currentTime;
          singleTapTimer = setTimeout(() => {
            lastTap = 0;
          }, 340);
        }
      });
    }

    function createHeartBurst(event, container) {
      const rect = container.getBoundingClientRect();
      const x = event.clientX ? (event.clientX - rect.left) : (rect.width / 2);
      const y = event.clientY ? (event.clientY - rect.top) : (rect.height / 2);

      playHeartChime();

      // Primary popping heart
      const mainHeart = document.createElement('div');
      mainHeart.className = 'heart-burst text-rose-500';
      mainHeart.style.left = `${x}px`;
      mainHeart.style.top = `${y}px`;
      mainHeart.innerHTML = `
        <svg class="w-24 h-24 sm:w-32 sm:h-32 fill-current drop-shadow-xl" viewBox="0 0 24 24">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
      `;
      container.appendChild(mainHeart);

      // Mini floating radiating sparkles
      const heartColors = ['#E26D82', '#852638', '#F43F5E', '#FDA4AF', '#FB7185'];
      for (let i = 0; i < 8; i++) {
        const mini = document.createElement('div');
        mini.className = 'mini-heart';
        const angle = (Math.PI * 2 / 8) * i + (Math.random() * 0.3 - 0.15);
        const distance = 50 + Math.random() * 55;
        const tx = Math.cos(angle) * distance;
        const ty = Math.sin(angle) * distance - 25;

        mini.style.setProperty('--tx', `${tx}px`);
        mini.style.setProperty('--ty', `${ty}px`);
        mini.style.left = `${x}px`;
        mini.style.top = `${y}px`;

        const color = heartColors[i % heartColors.length];
        mini.innerHTML = `
          <svg class="w-5 h-5 sm:w-6 sm:h-6" style="fill: ${color}" viewBox="0 0 24 24">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
        `;
        container.appendChild(mini);

        setTimeout(() => mini.remove(), 750);
      }

      setTimeout(() => mainHeart.remove(), 920);
    }

    function renderSlidePositions() {
      pictureFiles.forEach((_, idx) => {
        const slide = document.getElementById(`slide-${idx}`);
        const fillBar = document.getElementById(`fill-${idx}`);

        if (!slide) return;

        const distance = idx - activeIndex;

        if (distance === 0) {
          // Center Active Card
          slide.style.transform = 'translateX(0%) scale(1) rotateY(0deg) translateZ(0px)';
          slide.style.opacity = '1';
          slide.style.zIndex = '30';
          slide.style.pointerEvents = 'auto';
          slide.style.filter = 'drop-shadow(0 25px 35px rgba(100, 116, 139, 0.22))';
        } else if (distance === -1 || (distance === totalPictures - 1 && activeIndex === 0)) {
          // Previous Card Peeking Left
          slide.style.transform = 'translateX(-62%) scale(0.86) rotateY(16deg) translateZ(-80px)';
          slide.style.opacity = '0.35';
          slide.style.zIndex = '20';
          slide.style.pointerEvents = 'none';
          slide.style.filter = 'blur(1px)';
        } else if (distance === 1 || (distance === -(totalPictures - 1) && activeIndex === totalPictures - 1)) {
          // Next Card Peeking Right
          slide.style.transform = 'translateX(62%) scale(0.86) rotateY(-16deg) translateZ(-80px)';
          slide.style.opacity = '0.35';
          slide.style.zIndex = '20';
          slide.style.pointerEvents = 'none';
          slide.style.filter = 'blur(1px)';
        } else {
          // Offscreen
          const direction = distance > 0 ? 110 : -110;
          slide.style.transform = `translateX(${direction}%) scale(0.7) translateZ(-200px)`;
          slide.style.opacity = '0';
          slide.style.zIndex = '10';
          slide.style.pointerEvents = 'none';
        }

        // Update Minimal Story Bar
        if (fillBar) {
          if (idx <= activeIndex) {
            fillBar.style.width = '100%';
          } else {
            fillBar.style.width = '0%';
          }
        }
      });

      // Celebration specifically on the 8th picture (8.jpg: "We're getting married")
      if (pictureFiles[activeIndex] === '8.jpg') {
        if (typeof confetti === 'function') {
          confetti({
            particleCount: 110,
            spread: 80,
            origin: { y: 0.6 },
            colors: ['#852638', '#E26D82', '#9CB7D4', '#FCD34D', '#F472B6']
          });
        }
      }
    }

    function advanceNext() {
      if (activeIndex < totalPictures - 1) {
        activeIndex++;
      } else {
        activeIndex = 0; // Loop smoothly
      }
      renderSlidePositions();
    }

    function advancePrev() {
      if (activeIndex > 0) {
        activeIndex--;
      } else {
        activeIndex = totalPictures - 1;
      }
      renderSlidePositions();
    }

    function jumpToSlide(index) {
      if (index >= 0 && index < totalPictures) {
        activeIndex = index;
        renderSlidePositions();
      }
    }

    // Navigation buttons
    nextArrow.addEventListener('click', (e) => {
      e.stopPropagation();
      advanceNext();
    });
    prevArrow.addEventListener('click', (e) => {
      e.stopPropagation();
      advancePrev();
    });

    // Keyboard arrow controls
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        advanceNext();
      } else if (e.key === 'ArrowLeft') {
        advancePrev();
      } else if (e.key === 'm' || e.key === 'M') {
        toggleMute();
      }
    });

    let startX = 0;
    let startY = 0;
    let endX = 0;
    let endY = 0;

    cardDeck.addEventListener('touchstart', (e) => {
      startX = e.changedTouches[0].screenX;
      startY = e.changedTouches[0].screenY;
    }, { passive: true });

    cardDeck.addEventListener('touchend', (e) => {
      endX = e.changedTouches[0].screenX;
      endY = e.changedTouches[0].screenY;
      handleSwipe();
    }, { passive: true });

    function handleSwipe() {
      const diffX = endX - startX;
      const diffY = endY - startY;

      if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 40) {
        if (diffX < 0) {
          advanceNext();
        } else {
          advancePrev();
        }
      }
    }

    function startMusic() {
      if (audioInitiated) return;
      audioInitiated = true;

      backgroundAudio.volume = 0.55;
      const playPromise = backgroundAudio.play();

      if (playPromise !== undefined) {
        playPromise.then(() => {
          updateMuteButtonVisuals(true);
        }).catch(() => {
          // If browser restricts local audio playback or file not yet served,
          // seamlessly play the romantic piano ambient synth!
          if (!romanticPianoSynth) {
            romanticPianoSynth = new AmbientPianoSynthesizer();
          }
          romanticPianoSynth.start();
          updateMuteButtonVisuals(true);
        });
      }
    }

    function toggleMute() {
      startMusic();
      isSoundMuted = !isSoundMuted;

      backgroundAudio.muted = isSoundMuted;

      if (romanticPianoSynth) {
        romanticPianoSynth.setMute(isSoundMuted);
      }

      updateMuteButtonVisuals(!isSoundMuted);
    }

    function updateMuteButtonVisuals(isPlaying) {
      if (isPlaying && !isSoundMuted) {
        waveContainer.classList.remove('is-muted');
        waveContainer.classList.remove('hidden');
        muteCrossIcon.classList.add('hidden');
        muteLabelText.textContent = 'Mute';
      } else {
        waveContainer.classList.add('is-muted');
        waveContainer.classList.add('hidden');
        muteCrossIcon.classList.remove('hidden');
        muteLabelText.textContent = 'Unmute';
      }
    }

    muteToggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleMute();
    });

    // Start audio on first user tap/click anywhere (browser autoplay compliant)
    document.addEventListener('pointerdown', function firstTouchUnlock() {
      startMusic();
      document.removeEventListener('pointerdown', firstTouchUnlock);
    }, { once: true });

    // Initialize carousel on load
    window.addEventListener('load', () => {
      initCarousel();
    });
  </script>
</body>
</html>
