<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Little Light Reading</title>
  
  <!-- Preload all 13 slide images; slide 0 prioritizes 0.gif -->
  <link rel="preload" as="image" href="0.gif">
  <link rel="preload" as="image" href="0.jpg">
  <link rel="preload" as="image" href="1.jpg">
  <link rel="preload" as="image" href="2.jpg">
  <link rel="preload" as="image" href="3.jpg">
  <link rel="preload" as="image" href="4.jpg">
  <link rel="preload" as="image" href="5.jpg">
  <link rel="preload" as="image" href="6.jpg">
  <link rel="preload" as="image" href="7.jpg">
  <link rel="preload" as="image" href="8.jpg">
  <link rel="preload" as="image" href="9.jpg">
  <link rel="preload" as="image" href="10.jpg">
  <link rel="preload" as="image" href="11.jpg">
  <link rel="preload" as="image" href="12.jpg">
  
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg-color: #0b0f17;
      --card-bg: #fffbf0;
      --primary: #c2415d;
      --accent-glow: rgba(194, 65, 93, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background-color: var(--bg-color);
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      touch-action: manipulation;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Ambient Background Glow */
    .ambient-glow {
      position: absolute;
      width: 70vw;
      height: 70vh;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(194, 65, 93, 0.08) 0%, rgba(11, 15, 23, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Slim Segmented Story Progress Bar */
    .progress-container {
      position: absolute;
      top: max(14px, env(safe-area-inset-top));
      left: 16px;
      right: 16px;
      display: flex;
      gap: 5px;
      z-index: 50;
      pointer-events: none;
    }

    .progress-segment {
      flex: 1;
      height: 3px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      overflow: hidden;
      transition: background 0.3s ease;
    }

    .progress-segment.is-active {
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
    }

    .progress-segment.is-viewed {
      background: rgba(255, 255, 255, 0.55);
    }

    /* Floating Mute/Audio Button */
    .audio-btn {
      position: absolute;
      top: max(26px, calc(env(safe-area-inset-top) + 12px));
      right: max(16px, env(safe-area-inset-right));
      z-index: 60;
      background: rgba(18, 24, 38, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 24px;
      padding: 7px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.3px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), background-color 0.2s ease;
    }

    .audio-btn:hover {
      background: rgba(28, 36, 54, 0.88);
      transform: scale(1.04);
    }

    .audio-btn:active {
      transform: scale(0.96);
    }

    /* Soundwave Visualizer Bars */
    .sound-bars {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      width: 14px;
      height: 14px;
    }

    .sound-bar {
      width: 2.5px;
      background-color: #ff6b8b;
      border-radius: 1px;
      transition: height 0.2s ease;
    }

    .sound-bars.playing .sound-bar:nth-child(1) { animation: soundWave 0.8s ease-in-out infinite alternate; height: 12px; }
    .sound-bars.playing .sound-bar:nth-child(2) { animation: soundWave 0.6s ease-in-out infinite alternate 0.2s; height: 14px; }
    .sound-bars.playing .sound-bar:nth-child(3) { animation: soundWave 0.9s ease-in-out infinite alternate 0.4s; height: 8px; }

    .sound-bars.muted .sound-bar {
      height: 3px !important;
      background-color: rgba(255, 255, 255, 0.4);
      animation: none !important;
    }

    @keyframes soundWave {
      0% { height: 3px; }
      100% { height: 14px; }
    }

    /* Carousel Stage */
    .stage-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .cards-track {
      position: relative;
      width: min(94vw, calc((100dvh - 90px) * 1.6), 1000px);
      aspect-ratio: 16 / 10;
      max-height: 625px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Postcard Slide Elements */
    .slide-card {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
      pointer-events: none;
      visibility: hidden;
      opacity: 0;
      transition: transform 0.55s cubic-bezier(0.2, 0.9, 0.3, 1), opacity 0.45s ease, visibility 0.45s;
    }

    /* Card Image Anti-Blur Rules */
    .slide-card img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 14px;
      display: block;
      background-color: var(--card-bg);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65), 0 2px 8px rgba(0, 0, 0, 0.4);
      image-rendering: auto;
      pointer-events: auto;
    }

    /* Active Slide (Zero 3D Distortion / Crisp Native Render) */
    .slide-card.is-active {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
      z-index: 20;
      transform: none !important;
      will-change: auto !important;
    }

    /* Peeking Slide Offsets */
    .slide-card.is-prev {
      visibility: visible;
      opacity: 0.35;
      z-index: 10;
      transform: translate3d(-102%, 0, 0) scale(0.92);
      pointer-events: auto;
    }

    .slide-card.is-next {
      visibility: visible;
      opacity: 0.35;
      z-index: 10;
      transform: translate3d(102%, 0, 0) scale(0.92);
      pointer-events: auto;
    }

    .slide-card.is-far-prev {
      opacity: 0;
      transform: translate3d(-150%, 0, 0) scale(0.85);
    }

    .slide-card.is-far-next {
      opacity: 0;
      transform: translate3d(150%, 0, 0) scale(0.85);
    }

    /* Touch Zones for Quick Desktop & Mobile Navigation */
    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(18, 24, 38, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 40;
      backdrop-filter: blur(8px);
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .nav-arrow:hover {
      background: rgba(30, 40, 60, 0.85);
      transform: translateY(-50%) scale(1.1);
    }

    .nav-arrow:active {
      transform: translateY(-50%) scale(0.95);
    }

    .nav-arrow.prev-btn { left: 16px; }
    .nav-arrow.next-btn { right: 16px; }

    @media (max-width: 680px) {
      .nav-arrow {
        display: none; /* Mobile relies on intuitive left/right tap or swipe gestures */
      }
    }

    /* Double-Tap Heart Burst Animation */
    .heart-burst {
      position: absolute;
      pointer-events: none;
      z-index: 100;
      transform: translate(-50%, -50%) scale(0);
      animation: heartPop 0.8s cubic-bezier(0.17, 0.89, 0.32, 1.3) forwards;
    }

    .heart-burst svg {
      width: 80px;
      height: 80px;
      fill: #ff3366;
      filter: drop-shadow(0 4px 14px rgba(255, 51, 102, 0.6));
    }

    @keyframes heartPop {
      0% { transform: translate(-50%, -50%) scale(0) rotate(-15deg); opacity: 0; }
      40% { transform: translate(-50%, -50%) scale(1.25) rotate(5deg); opacity: 1; }
      70% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
      100% { transform: translate(-50%, -65px) scale(0.85); opacity: 0; }
    }

    .mini-particle {
      position: absolute;
      pointer-events: none;
      width: 14px;
      height: 14px;
      z-index: 99;
      animation: particleFly 0.75s ease-out forwards;
    }

    .mini-particle svg {
      width: 100%;
      height: 100%;
      fill: #ff6b8b;
    }

    @keyframes particleFly {
      0% { transform: translate(0, 0) scale(0.8); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="ambient-glow"></div>

  <!-- 13-Segment Progress Bar -->
  <div class="progress-container" id="progressBar"></div>

  <!-- Unobtrusive Audio / Mute Button -->
  <button class="audio-btn" id="muteToggle" aria-label="Toggle Sound">
    <div class="sound-bars playing" id="soundBars">
      <span class="sound-bar"></span>
      <span class="sound-bar"></span>
      <span class="sound-bar"></span>
    </div>
    <span id="audioStatusText">Mute</span>
  </button>

  <!-- Carousel Stage -->
  <div class="stage-container" id="stageContainer">
    <button class="nav-arrow prev-btn" id="prevBtn" aria-label="Previous">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    
    <div class="cards-track" id="cardsTrack"></div>

    <button class="nav-arrow next-btn" id="nextBtn" aria-label="Next">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>

  <!-- Background Audio with direct target to song-01.mp3 -->
  <audio id="bgAudio" src="song-01.mp3" preload="auto" loop playsinline webkit-playsinline></audio>

  <script>
    const TOTAL_SLIDES = 13;
    const CONFETTI_SLIDE_INDEX = 8; // Celebratory confetti on 8.jpg ("We're getting married.")
    
    let currentIndex = 0;
    let isMuted = false;
    let hasTriggeredConfettiForSlide8 = false;
    let audioContext = null;
    let synthInterval = null;
    let isSynthRunning = false;
    let usingFallback = false;
    let userHasUnlockedAudio = false;

    const cardsTrack = document.getElementById('cardsTrack');
    const progressBar = document.getElementById('progressBar');
    const muteToggle = document.getElementById('muteToggle');
    const soundBars = document.getElementById('soundBars');
    const audioStatusText = document.getElementById('audioStatusText');
    const bgAudio = document.getElementById('bgAudio');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    // 1. Initialize 13 Progress Segments
    for (let i = 0; i < TOTAL_SLIDES; i++) {
      const seg = document.createElement('div');
      seg.className = 'progress-segment' + (i === 0 ? ' is-active' : '');
      progressBar.appendChild(seg);
    }

    // 2. Build Slide Cards (Slide 0 uses 0.gif with automatic playback; falls back to 0.jpg)
    for (let i = 0; i < TOTAL_SLIDES; i++) {
      const card = document.createElement('div');
      card.className = 'slide-card';
      card.dataset.index = i;

      const img = document.createElement('img');
      img.alt = `Slide ${i}`;
      img.decoding = (i === 0) ? 'auto' : 'sync';
      img.loading = 'eager';

      if (i === 0) {
        img.src = '0.gif';
        img.onerror = function() {
          if (!this.dataset.fallbackTried) {
            this.dataset.fallbackTried = "true";
            this.src = '0.jpg';
          }
        };
      } else {
        img.src = `${i}.jpg`;
      }

      card.appendChild(img);
      cardsTrack.appendChild(card);
    }

    const slideElements = Array.from(document.querySelectorAll('.slide-card'));
    const segments = Array.from(document.querySelectorAll('.progress-segment'));

    function updateCarousel(newIndex) {
      if (newIndex < 0) newIndex = 0;
      if (newIndex >= TOTAL_SLIDES) newIndex = TOTAL_SLIDES - 1;
      currentIndex = newIndex;

      slideElements.forEach((card, idx) => {
        card.classList.remove('is-active', 'is-prev', 'is-next', 'is-far-prev', 'is-far-next');

        if (idx === currentIndex) {
          card.classList.add('is-active');
        } else if (idx === currentIndex - 1) {
          card.classList.add('is-prev');
        } else if (idx === currentIndex + 1) {
          card.classList.add('is-next');
        } else if (idx < currentIndex) {
          card.classList.add('is-far-prev');
        } else {
          card.classList.add('is-far-next');
        }
      });

      // Update progress segments
      segments.forEach((seg, idx) => {
        seg.classList.remove('is-active', 'is-viewed');
        if (idx === currentIndex) {
          seg.classList.add('is-active');
        } else if (idx < currentIndex) {
          seg.classList.add('is-viewed');
        }
      });

      // Confetti trigger on the 8th picture (8.jpg)
      if (currentIndex === CONFETTI_SLIDE_INDEX && !hasTriggeredConfettiForSlide8) {
        hasTriggeredConfettiForSlide8 = true;
        fireCelebrationConfetti();
      }
    }

    function fireCelebrationConfetti() {
      if (typeof confetti !== 'function') return;
      const count = 200;
      const defaults = { origin: { y: 0.7 }, zIndex: 999 };

      function fire(particleRatio, opts) {
        confetti(Object.assign({}, defaults, opts, {
          particleCount: Math.floor(count * particleRatio)
        }));
      }

      fire(0.25, { spread: 26, startVelocity: 55, colors: ['#ff69b4', '#ff1493', '#ffb6c1'] });
      fire(0.2, { spread: 60, colors: ['#ffffff', '#fce4ec', '#ff3366'] });
      fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
      fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, colors: ['#e91e63', '#ff4081'] });
      fire(0.1, { spread: 120, startVelocity: 45 });
    }

    // Navigation triggers
    prevBtn.addEventListener('click', (e) => { e.stopPropagation(); updateCarousel(currentIndex - 1); });
    nextBtn.addEventListener('click', (e) => { e.stopPropagation(); updateCarousel(currentIndex + 1); });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') updateCarousel(currentIndex - 1);
      if (e.key === 'ArrowRight' || e.key === ' ') updateCarousel(currentIndex + 1);
    });

    // 3. Heart Burst & Sound Effect on Double Tap
    function playHeartChime() {
      if (isMuted) return;
      try {
        const ctx = audioContext || new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') ctx.resume();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
        osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.12); // A5
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.35);
      } catch (e) {}
    }

    function createHeartBurst(x, y) {
      playHeartChime();

      const burst = document.createElement('div');
      burst.className = 'heart-burst';
      burst.style.left = `${x}px`;
      burst.style.top = `${y}px`;
      burst.innerHTML = `
        <svg viewBox="0 0 24 24">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
      `;
      document.body.appendChild(burst);
      setTimeout(() => burst.remove(), 800);

      for (let i = 0; i < 6; i++) {
        const mini = document.createElement('div');
        mini.className = 'mini-particle';
        mini.style.left = `${x}px`;
        mini.style.top = `${y}px`;
        const angle = (Math.PI * 2 * i) / 6 + (Math.random() * 0.4 - 0.2);
        const dist = 45 + Math.random() * 40;
        mini.style.setProperty('--tx', `${Math.cos(angle) * dist}px`);
        mini.style.setProperty('--ty', `${Math.sin(angle) * dist}px`);
        mini.innerHTML = `
          <svg viewBox="0 0 24 24">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
        `;
        document.body.appendChild(mini);
        setTimeout(() => mini.remove(), 750);
      }
    }

    // Touch & Tap Gesture Engine
    let lastTapTime = 0;
    let touchStartX = 0;
    let touchStartY = 0;

    cardsTrack.addEventListener('touchstart', (e) => {
      const touch = e.changedTouches[0];
      touchStartX = touch.clientX;
      touchStartY = touch.clientY;
    }, { passive: true });

    cardsTrack.addEventListener('touchend', (e) => {
      const touch = e.changedTouches[0];
      const deltaX = touch.clientX - touchStartX;
      const deltaY = touch.clientY - touchStartY;
      const currentTime = Date.now();

      // Swipe detection
      if (Math.abs(deltaX) > 45 && Math.abs(deltaY) < 60) {
        if (deltaX < 0) updateCarousel(currentIndex + 1);
        else updateCarousel(currentIndex - 1);
        return;
      }

      // Double-tap heart pop
      if (currentTime - lastTapTime < 320 && Math.abs(deltaX) < 15 && Math.abs(deltaY) < 15) {
        createHeartBurst(touch.clientX, touch.clientY);
        lastTapTime = 0;
        return;
      }
      lastTapTime = currentTime;

      // Single tap on side edges to advance
      if (Math.abs(deltaX) < 10 && Math.abs(deltaY) < 10) {
        const bounds = cardsTrack.getBoundingClientRect();
        const clickRatio = (touch.clientX - bounds.left) / bounds.width;
        if (clickRatio < 0.25) updateCarousel(currentIndex - 1);
        else if (clickRatio > 0.75) updateCarousel(currentIndex + 1);
      }
    });

    cardsTrack.addEventListener('dblclick', (e) => {
      createHeartBurst(e.clientX, e.clientY);
    });

    // 4. Audio Engine (song-01.mp3 with Robust Autoplay & Gentle Synth Fallback)
    function updateAudioUI(isPlaying) {
      if (isMuted || !isPlaying) {
        soundBars.className = 'sound-bars muted';
        audioStatusText.textContent = 'Unmute';
      } else {
        soundBars.className = 'sound-bars playing';
        audioStatusText.textContent = 'Mute';
      }
    }

    function startNativeAudio() {
      if (isMuted) return;
      bgAudio.muted = false;
      const promise = bgAudio.play();
      if (promise !== undefined) {
        promise.then(() => {
          usingFallback = false;
          stopSynthMusic();
          updateAudioUI(true);
        }).catch((err) => {
          if (err.name === 'NotAllowedError') {
            // Autoplay deferred pending user touch/click. Do NOT switch to synth.
            updateAudioUI(false);
          } else {
            console.warn('HTML5 audio error, holding fallback ready:', err);
          }
        });
      }
    }

    // Procedural Piano Fallback Synthesizer (Only if MP3 completely fails to load)
    function startSynthMusic() {
      if (isSynthRunning || isMuted) return;
      try {
        if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
        if (audioContext.state === 'suspended') audioContext.resume();

        const notes = [
          261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88,
          523.25, 587.33, 659.25, 698.46, 783.99
        ];
        const chords = [
          [0, 4, 7, 11],
          [9, 12, 16, 19],
          [5, 9, 12, 16],
          [7, 11, 14, 17]
        ];

        let chordStep = 0;
        isSynthRunning = true;

        synthInterval = setInterval(() => {
          if (isMuted || !isSynthRunning) return;
          const currentChord = chords[chordStep % chords.length];
          currentChord.forEach((noteIdx, i) => {
            setTimeout(() => {
              if (isMuted || !isSynthRunning) return;
              const freq = notes[noteIdx % notes.length];
              const osc = audioContext.createOscillator();
              const gain = audioContext.createGain();
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(freq, audioContext.currentTime);
              gain.gain.setValueAtTime(0.02, audioContext.currentTime);
              gain.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + 1.6);
              osc.connect(gain);
              gain.connect(audioContext.destination);
              osc.start();
              osc.stop(audioContext.currentTime + 1.6);
            }, i * 220);
          });
          chordStep++;
        }, 1800);

        updateAudioUI(true);
      } catch (e) {
        console.warn('AudioContext unavailable:', e);
      }
    }

    function stopSynthMusic() {
      isSynthRunning = false;
      if (synthInterval) clearInterval(synthInterval);
    }

    // Only switch to synth if file fails to load entirely
    bgAudio.addEventListener('error', () => {
      console.warn("song-01.mp3 failed to load. Enabling ambient synthesizer fallback.");
      usingFallback = true;
      if (!isMuted && userHasUnlockedAudio) startSynthMusic();
    });

    // Mute / Unmute Button Handler
    muteToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      isMuted = !isMuted;

      if (isMuted) {
        bgAudio.pause();
        stopSynthMusic();
        updateAudioUI(false);
      } else {
        if (!usingFallback) {
          startNativeAudio();
        } else {
          startSynthMusic();
        }
      }
    });

    // First User Gesture Unlock (Guarantees instant sound even under strict browser autoplay blocks)
    function unlockAudioOnInteraction() {
      userHasUnlockedAudio = true;
      if (!isMuted) {
        if (!usingFallback) {
          if (bgAudio.paused) startNativeAudio();
        } else {
          startSynthMusic();
        }
      }
      window.removeEventListener('pointerdown', unlockAudioOnInteraction, true);
      window.removeEventListener('touchstart', unlockAudioOnInteraction, true);
      window.removeEventListener('click', unlockAudioOnInteraction, true);
      window.removeEventListener('keydown', unlockAudioOnInteraction, true);
    }

    window.addEventListener('pointerdown', unlockAudioOnInteraction, true);
    window.addEventListener('touchstart', unlockAudioOnInteraction, true);
    window.addEventListener('click', unlockAudioOnInteraction, true);
    window.addEventListener('keydown', unlockAudioOnInteraction, true);

    // Initial Playback Attempt on Page Load
    window.addEventListener('DOMContentLoaded', () => {
      updateCarousel(0);
      startNativeAudio();
    });

    window.addEventListener('load', () => {
      startNativeAudio();
    });
  </script>
</body>
</html>
